# barrage-ceiling-50k.yml — phylax 50k-changes/s probe.
# BATCHED inserts: each statement is one multi-row INSERT, so 1 request
# = 50 row-changes. changes/s = statements/s x rows-per-statement:
#   1,000 statements/s x 50 rows = 50,000 changes/s.
# users.email is UNIQUE, so each VALUES row gets its own random()+clock_timestamp().
# NOTE: edit the conn line to your real DSN before running (placeholders by design).
duration: 30s
bucket_width: 2s
ramp: 5s
concurrency: 100

db:
  rate: 1000
  target:
    driver: postgres
    conn: postgres://user:pass@localhost:5432/db?sslmode=disable
    queries:
      # 60% of statements -> orders batches
      - query: >-
          INSERT INTO orders (user_id, total, placed_at) VALUES (1, 25.00, now()), (1, 25.00, now()), (1, 25.00, now()), (1, 25.00, now()), (1, 25.00, now()), (1, 25.00, now()), (1, 25.00, now()), (1, 25.00, now()), (1, 25.00, now()), (1, 25.00, now()), (1, 25.00, now()), (1, 25.00, now()), (1, 25.00, now()), (1, 25.00, now()), (1, 25.00, now()), (1, 25.00, now()), (1, 25.00, now()), (1, 25.00, now()), (1, 25.00, now()), (1, 25.00, now()), (1, 25.00, now()), (1, 25.00, now()), (1, 25.00, now()), (1, 25.00, now()), (1, 25.00, now()), (1, 25.00, now()), (1, 25.00, now()), (1, 25.00, now()), (1, 25.00, now()), (1, 25.00, now()), (1, 25.00, now()), (1, 25.00, now()), (1, 25.00, now()), (1, 25.00, now()), (1, 25.00, now()), (1, 25.00, now()), (1, 25.00, now()), (1, 25.00, now()), (1, 25.00, now()), (1, 25.00, now()), (1, 25.00, now()), (1, 25.00, now()), (1, 25.00, now()), (1, 25.00, now()), (1, 25.00, now()), (1, 25.00, now()), (1, 25.00, now()), (1, 25.00, now()), (1, 25.00, now()), (1, 25.00, now())
        weight: 60
        type: write
      # 40% of statements -> users batches (unique emails)
      - query: >-
