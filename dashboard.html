<!doctype html>
<!--
  phylax — replication console.

  Single-file dashboard: no framework, no build. It consumes the two SSE
  endpoints of the phylax Server on the same origin:

    /metrics/stream  → {"changes_processed":N,"changes_dropped":N,
                        "subscribers":N,"replication_lag_bytes":N}  (1/s)
    /events          → {"Table":...,"Operation":...,"OldRow":...,"NewRow":...}

  Preview: python3 -m http.server 8000  →  http://localhost:8000/dashboard.html
  (endpoints 404 until the Go server serves them — design-review friendly)

  Design: black & white, both modes; Fira Code for data, Fira Sans for
  labels; the lag sparkline (log-scale, labelled axis) is the page's one
  signature element.

  Responsive: mobile-first; fluid type and spacing (clamp); container
  query for the change feed; viewport breakpoints sized to content;
  safe-area insets for notched devices; ≥44px touch targets on coarse
  pointers.
-->
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>phylax · replication console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Fira+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/regular/style.css">
<script>
// Theme init before paint: stored choice wins, else the system preference.
(function () {
  var t = localStorage.getItem("phylax-theme");
  if (t !== "light" && t !== "dark") {
    t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
  }
  document.documentElement.dataset.theme = t;
})();
</script>
<style>
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #000000;
  --panel: #0c0c0e;
  --border: #232327;
  --border-soft: #16161a;
  --text: #f5f5f6;
  --muted: #9a9aa2;
  --faint: #606068;
  --solid: #f5f5f6; /* inverted blocks (status dot, op marks) */
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #ffffff;
  --panel: #fafafb;
  --border: #e4e4e8;
  --border-soft: #efeff2;
  --text: #101013;
  --muted: #6a6a73;
  --faint: #9c9ca4;
  --solid: #101013;
}

* { box-sizing: border-box; }

html, body { margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font: 400 clamp(15px, 1vw + 13px, 16px)/1.5 "Fira Sans", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}

:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

.wrap {
  max-width: 1060px; margin: 0 auto;
  padding-block: clamp(14px, 3vw, 24px) clamp(28px, 7vw, 48px);
  padding-inline: max(16px, env(safe-area-inset-left)) max(16px, env(safe-area-inset-right));
}

/* ── top bar ─────────────────────────────────────────── */

.topbar {
  position: sticky; top: 0; z-index: 5;
  background: var(--bg);
  display: flex; align-items: center; justify-content: space-between;
  gap: 14px; flex-wrap: wrap;
  padding-block: clamp(12px, 2vw, 18px);
  border-bottom: 1px solid var(--border);
}

.identity { display: flex; align-items: baseline; gap: clamp(12px, 2vw, 18px); min-width: 0; }

.wordmark {
  font: 600 clamp(12px, 0.6vw + 11px, 14px)/1 "Fira Code", ui-monospace, monospace;
  letter-spacing: 0.22em; text-transform: uppercase; flex: none;
}
.wordmark::after { content: "▍"; color: var(--faint); }

.session {
  font: 400 clamp(11.5px, 0.5vw + 10.5px, 13px)/1 "Fira Code", ui-monospace, monospace;
  color: var(--muted);
  display: flex; align-items: center; gap: 10px; min-width: 0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

.dot {
  width: 8px; height: 8px; border-radius: 50%;
  border: 1.5px solid var(--faint); flex: none;
}
.dot.live { background: var(--solid); border-color: var(--solid); }

.freshness { color: var(--faint); flex: none; }

.sep { color: var(--faint); }

.controls { display: flex; gap: 10px; }

.btn {
  display: inline-flex; align-items: center; gap: 8px;
  font: 500 clamp(12px, 0.4vw + 11px, 13px)/1 "Fira Sans", system-ui, sans-serif;
  color: var(--text);
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: 9px 13px;
  cursor: pointer;
  transition: background-color 160ms ease, border-color 160ms ease;
}
.btn:hover { background: var(--panel); border-color: var(--muted); }
.btn:active { transform: translateY(1px); }
.btn[aria-pressed="true"] { background: var(--solid); color: var(--bg); border-color: var(--solid); }
.btn .ph { font-size: 15px; line-height: 1; flex: none; }

/* ── KPI row ─────────────────────────────────────────── */

.kpis {
  display: grid; gap: clamp(10px, 1.4vw, 14px);
  grid-template-columns: repeat(4, 1fr);
  margin-block: clamp(16px, 2.5vw, 22px);
}

.kpi {
  background: var(--panel);
  border: 1px solid var(--border-soft);
  border-radius: 10px;
  padding: clamp(14px, 2vw, 18px) clamp(14px, 2.5vw, 20px) clamp(12px, 2vw, 16px);
  min-width: 0;
}

.kpi-label {
  margin: 0 0 clamp(8px, 1.2vw, 12px);
  font: 500 clamp(10px, 0.3vw + 9.5px, 11px)/1.2 "Fira Sans", system-ui, sans-serif;
  text-transform: uppercase; letter-spacing: 0.11em;
  color: var(--muted);
}

.kpi-num {
  margin: 0;
  font: 500 clamp(26px, 3.2vw + 18px, 44px)/1.05 "Fira Code", ui-monospace, monospace;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.03em;
  overflow-wrap: anywhere;
}

.kpi-num.tick { animation: tick 150ms ease-out; }
@keyframes tick { 0% { opacity: 0.35; } 100% { opacity: 1; } }

.kpi-sub { margin: 10px 0 0; font: 400 clamp(10px, 0.3vw + 9.5px, 11px)/1.3 "Fira Code", ui-monospace, monospace; color: var(--faint); }

/* lag card grows the sparkline */

.kpi-lag { display: flex; flex-direction: column; }
.kpi-lag .kpi-num { flex: none; }

.lag-chart {
  width: 100%; height: clamp(48px, 9vw, 64px);
  margin-top: auto; padding-top: 14px;
  display: block;
}

/* ── change feed ─────────────────────────────────────── */

.feed { container-type: inline-size; }

.feed-head {
  display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
  padding-bottom: 10px; margin-bottom: 12px;
  border-bottom: 1px solid var(--border);
}

.feed-head h2 {
  margin: 0;
  font: 600 clamp(11px, 0.4vw + 10.5px, 12px)/1 "Fira Code", ui-monospace, monospace;
  text-transform: uppercase; letter-spacing: 0.18em;
}

.feed-meta { font: 400 clamp(11px, 0.4vw + 10.5px, 12px)/1 "Fira Code", ui-monospace, monospace; color: var(--faint); white-space: nowrap; }

.feed-empty {
  padding: 28px 4px;
  font: 400 clamp(13px, 0.5vw + 12px, 14px)/1.5 "Fira Sans", system-ui, sans-serif;
  color: var(--muted);
}

.feed-row {
  display: grid;
  grid-template-columns: 72px auto 110px 1fr;
  gap: clamp(6px, 1vw, 10px); align-items: baseline;
  padding-block: 7px; padding-inline: 4px;
  font: 400 clamp(11.5px, 0.5vw + 10.5px, 12.5px)/1.4 "Fira Code", ui-monospace, monospace;
  border-bottom: 1px solid var(--border-soft);
}
.feed-row:hover { background: var(--panel); }

.feed-time { color: var(--faint); font-variant-numeric: tabular-nums; }

.op {
  font: 600 10px/1 "Fira Code", ui-monospace, monospace;
  text-transform: uppercase; letter-spacing: 0.06em;
  border-radius: 4px;
  padding: 3px 7px;
  display: inline-flex; align-items: center; justify-content: center;
  justify-self: start; white-space: nowrap;
}
.op-insert { background: var(--solid); color: var(--bg); }
.op-update { background: transparent; color: var(--text); border: 1px solid var(--border); }
.op-delete {
  background: var(--solid); color: var(--bg);
  text-decoration: line-through; text-decoration-thickness: 1.5px;
}

.feed-table { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.feed-detail {
  color: var(--muted);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  min-width: 0;
}

.feed-rows {
  max-height: min(56vh, 460px);
  overflow-y: auto;
  overscroll-behavior: contain;
  scrollbar-width: thin;
  scrollbar-color: var(--faint) transparent;
  scrollbar-gutter: stable;
}
.feed-rows::-webkit-scrollbar { width: 8px; }
.feed-rows::-webkit-scrollbar-thumb { background: var(--faint); border-radius: 4px; }
.feed-rows::-webkit-scrollbar-track { background: transparent; }

/* narrow container: time + op + table on one line, detail wraps under */

@container (max-width: 470px) {
  .feed-row { grid-template-columns: 58px auto 1fr; }
  .feed-detail { grid-column: 3; }
}

/* ── responsive ──────────────────────────────────────── */

/* KPI cards: 4 → 2 → 1, driven by content width */
@media (max-width: 980px) {
  .kpis { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 620px) {
  .kpis { grid-template-columns: 1fr; }
}

/* top bar stacks; controls spread across the full row */
@media (max-width: 720px) {
  .topbar { flex-direction: column; align-items: stretch; }
  .controls { justify-content: space-between; }
  .controls .btn { flex: 1; justify-content: center; }
  .freshness { display: none; }
}

/* touch: ≥44px targets */
@media (pointer: coarse) {
  .btn { min-height: 44px; }
  .feed-row { padding-block: 10px; }
}
</style>
</head>
<body>
<div class="wrap">

  <header class="topbar">
    <div class="identity">
      <span class="wordmark">phylax</span>
      <span class="session" id="sessionLine">
        <span class="dot" id="statusDot" aria-hidden="true"></span>
        <span id="statusText" aria-live="polite">connecting…</span>
        <span class="sep" id="freshnessSep" hidden>·</span>
        <span class="freshness" id="freshness" aria-hidden="true"></span>
        <span class="sep">·</span>slot&nbsp;<span id="slotName">my_slot</span>
      </span>
    </div>
    <div class="controls">
      <button class="btn" id="exportBtn" aria-label="Download change feed as CSV">
        <i class="ph ph-download-simple" aria-hidden="true"></i>
        <span>Export CSV</span>
      </button>
      <button class="btn" id="pauseBtn" aria-pressed="false" aria-label="Pause the change feed">
        <i class="ph ph-pause" id="pauseIcon" aria-hidden="true"></i>
        <span id="pauseLabel">Pause feed</span>
      </button>
      <button class="btn" id="themeBtn" aria-label="Switch colour mode">
        <i class="ph ph-moon" id="themeIcon" aria-hidden="true"></i>
        <span id="themeLabel">Dark</span>
      </button>
    </div>
  </header>

  <main>
    <section class="kpis" aria-label="Replication metrics">
      <article class="kpi">
        <p class="kpi-label">changes processed</p>
        <p class="kpi-num" id="kpi-processed">–</p>
      </article>
      <article class="kpi">
        <p class="kpi-label">changes dropped</p>
        <p class="kpi-num" id="kpi-dropped">–</p>
      </article>
      <article class="kpi">
        <p class="kpi-label">subscribers</p>
        <p class="kpi-num" id="kpi-subscribers">–</p>
      </article>
      <article class="kpi kpi-lag">
        <p class="kpi-label">replication lag</p>
        <p class="kpi-num" id="kpi-lag">–</p>
        <canvas class="lag-chart" id="lagChart" aria-label="Replication lag over the last 60 seconds"></canvas>
      </article>
    </section>

    <section class="feed" aria-label="Change feed">
      <div class="feed-head">
        <h2>changes</h2>
        <span class="feed-meta" id="feedMeta">0 rows</span>
      </div>
      <p class="feed-empty" id="feedEmpty">No changes yet — they'll appear here as they stream.</p>
      <div id="feedRows" class="feed-rows"></div>
    </section>
  </main>

</div>

<script>
"use strict";

// ── config ──────────────────────────────────────────────────────────
// slot is cosmetic (matches the server's slot); base is where the SSE
// endpoints live — relative by default, so this file works from any
// origin that serves /metrics/stream and /events.
const cfg = {
  slot: "my_slot",
  base: "",
  feedLimit: 50,
  lagWindowMs: 60_000,
  rateWindowMs: 60_000,
  staleAfterMs: 4_000,
};

// ── elements ────────────────────────────────────────────────────────
const $ = (id) => document.getElementById(id);
const els = {
  statusDot: $("statusDot"), statusText: $("statusText"),
  freshness: $("freshness"), freshnessSep: $("freshnessSep"),
  exportBtn: $("exportBtn"),
  pauseBtn: $("pauseBtn"), pauseLabel: $("pauseLabel"), pauseIcon: $("pauseIcon"),
  themeBtn: $("themeBtn"), themeLabel: $("themeLabel"), themeIcon: $("themeIcon"),
  processed: $("kpi-processed"), dropped: $("kpi-dropped"),
  subscribers: $("kpi-subscribers"), lag: $("kpi-lag"),
  chart: $("lagChart"), feedEmpty: $("feedEmpty"),
  feedRows: $("feedRows"), feedMeta: $("feedMeta"),
};

// ── state ───────────────────────────────────────────────────────────
const state = {
  paused: false,
  lastFrameAt: 0,
  lagSamples: [],          // {t, bytes}
  feed: [],                // {time, t, table, op, row} — newest first, mirrors the DOM
  window: [],              // change timestamps for the throughput estimate
  feedCount: 0,
  reducedMotion: window.matchMedia("(prefers-reduced-motion: reduce)").matches,
};

// ── formatting ──────────────────────────────────────────────────────
const nf = new Intl.NumberFormat("en-US");
const fmtCount = (n) => nf.format(n);
const fmtBytes = (b) => {
  if (b >= 1 << 20) return (b / (1 << 20)).toFixed(2) + " MB";
  if (b >= 1 << 10) return (b / (1 << 10)).toFixed(1) + " KB";
  return nf.format(b) + " B";
};
const fmtTime = (d) => d.toTimeString().slice(0, 8);
const fmtAgo = (ms) => {
  const s = Math.max(0, Math.round(ms / 1000));
  if (s < 60) return s + "s ago";
  return Math.floor(s / 60) + "m " + (s % 60) + "s ago";
};

// ── KPIs ────────────────────────────────────────────────────────────
function tickNum(el, value) {
  if (el.textContent !== value) {
    el.textContent = value;
    if (!state.reducedMotion) {
      el.classList.remove("tick");
      void el.offsetWidth; // restart the animation
      el.classList.add("tick");
    }
  }
}

function applyMetrics(snap) {
  tickNum(els.processed, fmtCount(snap.changes_processed));
  tickNum(els.dropped, fmtCount(snap.changes_dropped));
  tickNum(els.subscribers, fmtCount(snap.subscribers));
  tickNum(els.lag, fmtBytes(snap.replication_lag_bytes));
  state.lastFrameAt = Date.now();
  els.freshness.textContent = "now";
  els.freshnessSep.hidden = false;
  if (!state.paused) {
    state.lagSamples.push({ t: state.lastFrameAt, bytes: snap.replication_lag_bytes });
    trimSamples();
    drawLag();
  }
}

// ── lag sparkline ───────────────────────────────────────────────────
function trimSamples() {
  const cutoff = Date.now() - cfg.lagWindowMs;
  while (state.lagSamples.length && state.lagSamples[0].t < cutoff) state.lagSamples.shift();
}

function drawLag() {
  const canvas = els.chart;
  const dpr = window.devicePixelRatio || 1;
  const cssW = canvas.clientWidth, cssH = canvas.clientHeight;
  if (cssW === 0) return;
  if (canvas.width !== Math.round(cssW * dpr) || canvas.height !== Math.round(cssH * dpr)) {
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
  }
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cssW, cssH);

  const cs = getComputedStyle(document.documentElement);
  const color = cs.getPropertyValue("--text").trim() || "#f5f5f6";
  const faint = cs.getPropertyValue("--faint").trim() || "#606068";

  // Left axis for decade labels; the plot sits to its right.
  const axisW = 36;
  const top = 4, bottom = cssH - 6, span = bottom - top;
  const plotL = axisW, plotR = cssW;

  // Log scale: every decade is the same pixel height, so a spike never
  // overflows the top and small values stay readable. y(0) = bottom.
  let peak = 1;
  for (const s of state.lagSamples) if (s.bytes > peak) peak = s.bytes;
  const log1p = (v) => Math.log10(1 + v);
  const maxLog = log1p(peak);
  const y = (b) => top + span * (1 - log1p(b) / maxLog);

  // decade gridlines, labelled when they fit
  const axisLabel = (v) =>
    v >= 1 << 20 ? (v >> 20) + "M" : v >= 1 << 10 ? (v >> 10) + "K" : String(v);
  ctx.font = "400 9px 'Fira Code', ui-monospace, monospace";
  ctx.textAlign = "right";
  ctx.lineWidth = 1;
  const minLabelGap = 11; // px between labels before we drop one
  let lastLabelY = Infinity;
  const gridline = (yy, label) => {
    ctx.strokeStyle = faint;
    ctx.beginPath();
    ctx.moveTo(plotL, yy);
    ctx.lineTo(plotR, yy);
    ctx.stroke();
    if (yy < lastLabelY - minLabelGap) {
      ctx.fillStyle = faint;
      ctx.fillText(label, plotL - 4, yy + 3);
      lastLabelY = yy;
    }
  };

  // bottom line = 0 (always labelled)
  gridline(bottom, "0");

  // one line per decade up to the peak
  for (let v = 1; v <= peak; v *= 10) {
    gridline(Math.round(y(v)) + 0.5, axisLabel(v));
  }

  if (state.lagSamples.length < 2) return;

  const t0 = Date.now() - cfg.lagWindowMs, t1 = Date.now();
  const x = (t) => plotL + ((t - t0) / Math.max(t1 - t0, 1)) * (plotR - plotL);

  ctx.strokeStyle = color;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  state.lagSamples.forEach((s, i) => {
    const px = x(s.t), py = y(Math.min(s.bytes, peak));
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  });
  ctx.stroke();

  // live cursor dot at the latest sample
  const last = state.lagSamples[state.lagSamples.length - 1];
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(x(last.t), y(Math.min(last.bytes, peak)), 2.5, 0, Math.PI * 2);
  ctx.fill();
}

// ── change feed ─────────────────────────────────────────────────────
const opGlyph = { insert: "+", update: "~", delete: "×" };
const opClass = { insert: "op-insert", update: "op-update", delete: "op-delete" };

function rowSummary(change) {
  const row = change.NewRow || change.OldRow || {};
  return JSON.stringify(row);
}

function updateFeedMeta() {
  if (state.paused) {
    els.feedMeta.textContent = "paused · " + state.feedCount + (state.feedCount === 1 ? " row" : " rows");
    return;
  }
  let meta = state.feedCount + (state.feedCount === 1 ? " row" : " rows");
  const rate = state.window.length / (cfg.rateWindowMs / 1000);
  if (rate >= 0.05) meta += " · ~" + (rate >= 10 ? Math.round(rate) : rate.toFixed(1)) + "/s";
  els.feedMeta.textContent = meta;
}

function addChange(change) {
  if (state.paused) return;
  if (state.feedCount === 0) els.feedEmpty.hidden = true;

  const row = document.createElement("div");
  row.className = "feed-row";

  const time = document.createElement("span");
  time.className = "feed-time";
  time.textContent = fmtTime(new Date());

  const op = document.createElement("span");
  op.className = "op " + (opClass[change.Operation] || "op-insert");
  op.textContent = (opGlyph[change.Operation] || "+") + " " + change.Operation;

  const table = document.createElement("span");
  table.className = "feed-table";
  table.textContent = change.Table;

  const detail = document.createElement("span");
  detail.className = "feed-detail";
  detail.textContent = rowSummary(change);
  detail.title = rowSummary(change);

  row.append(time, op, table, detail);
  els.feedRows.prepend(row);

  const summary = rowSummary(change);
  state.feed.unshift({ time: fmtTime(new Date()), t: Date.now(), table: change.Table, op: change.Operation, row: summary });
  state.feedCount++;
  while (state.feed.length > cfg.feedLimit) state.feed.pop();
  while (els.feedRows.children.length > cfg.feedLimit) els.feedRows.lastChild.remove();

  // throughput estimate: change timestamps within the last 60s
  const now = Date.now();
  state.window.push(now);
  const cutoff = now - cfg.rateWindowMs;
  while (state.window.length && state.window[0] < cutoff) state.window.shift();

  updateFeedMeta();
}

// ── status / health ─────────────────────────────────────────────────
function setStatus(live, text) {
  els.statusDot.classList.toggle("live", live);
  els.statusText.textContent = text;
}

setInterval(() => {
  if (state.lastFrameAt > 0) {
    const ago = Date.now() - state.lastFrameAt;
    els.freshness.textContent = fmtAgo(ago);
    if (ago > cfg.staleAfterMs) setStatus(false, "stale — reconnecting…");
  }
  updateFeedMeta(); // let the throughput estimate decay when the feed idles
}, 1000);

// ── controls ────────────────────────────────────────────────────────
els.pauseBtn.addEventListener("click", () => {
  state.paused = !state.paused;
  els.pauseBtn.setAttribute("aria-pressed", String(state.paused));
  els.pauseLabel.textContent = state.paused ? "Resume feed" : "Pause feed";
  els.pauseIcon.classList.toggle("ph-pause", !state.paused);
  els.pauseIcon.classList.toggle("ph-play", state.paused);
  updateFeedMeta();
});

els.themeBtn.addEventListener("click", () => {
  const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  localStorage.setItem("phylax-theme", next);
  els.themeLabel.textContent = next === "dark" ? "Light" : "Dark";
  els.themeBtn.setAttribute("aria-label", "Switch to " + (next === "dark" ? "light" : "dark") + " mode");
  els.themeIcon.classList.toggle("ph-moon", next === "dark");
  els.themeIcon.classList.toggle("ph-sun", next !== "dark");
  drawLag(); // redraw in the new colours
});

function syncThemeLabel() {
  const t = document.documentElement.dataset.theme;
  els.themeLabel.textContent = t === "dark" ? "Light" : "Dark";
  els.themeBtn.setAttribute("aria-label", "Switch to " + (t === "dark" ? "light" : "dark") + " mode");
  els.themeIcon.classList.toggle("ph-moon", t === "dark");
  els.themeIcon.classList.toggle("ph-sun", t !== "dark");
}
syncThemeLabel();

// ── export ──────────────────────────────────────────────────────────
const csvField = (s) => {
  const str = String(s ?? "");
  return /[",\r\n]/.test(str) ? '"' + str.replace(/"/g, '""') + '"' : str;
};

function exportCSV() {
  const header = "time,table,operation,row";
  const body = state.feed
    .map((r) => [r.time, r.table, r.op, r.row].map(csvField).join(","))
    .join("\r\n");
  const d = new Date();
  const pad = (n) => String(n).padStart(2, "0");
  const stamp = d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + "-" +
                pad(d.getHours()) + pad(d.getMinutes()) + pad(d.getSeconds());
  const blob = new Blob(["\uFEFF" + header + "\r\n" + body], { type: "text/csv;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "phylax-changes-" + stamp + ".csv";
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

els.exportBtn.addEventListener("click", exportCSV);

// ── SSE ─────────────────────────────────────────────────────────────
function connectMetrics() {
  const es = new EventSource(cfg.base + "/metrics/stream");
  es.onopen = () => setStatus(true, "streaming");
  es.onmessage = (e) => {
    try { applyMetrics(JSON.parse(e.data)); }
    catch (err) { console.warn("bad metrics frame", e.data, err); }
  };
  es.onerror = () => setStatus(false, "reconnecting…");
}

function connectEvents() {
  const es = new EventSource(cfg.base + "/events");
  es.onmessage = (e) => {
    try { addChange(JSON.parse(e.data)); }
    catch (err) { console.warn("bad change frame", e.data, err); }
  };
  // /events has no heartbeat of its own; EventSource retries on error.
}

$("slotName").textContent = cfg.slot;
connectMetrics();
connectEvents();
</script>
</body>
